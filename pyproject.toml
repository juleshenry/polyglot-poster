[project]
name = "polyglot-poster"
version = "0.1.0"
description = "OCR photos of a French textbook into a six-language wall poster."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "reportlab>=4.0",
  "pillow>=10.0",
  "pytesseract>=0.3.10",
  "pillow-heif>=0.16",
]

[project.scripts]
polyglot-poster = "polyglot_poster.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
